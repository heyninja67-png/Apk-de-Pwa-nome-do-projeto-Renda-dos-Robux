plugins { id 'com.android.application' }

def signingPropsFile=rootProject.file("signing.properties")
def signingProps=new Properties()
if(signingPropsFile.exists()){signingPropsFile.withInputStream{signingProps.load(it)}}

android {
 namespace 'earth.rblx.rendadosrobuxs'
 compileSdk 35
 defaultConfig { applicationId 'earth.rblx.rendadosrobuxs'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0.0' }
 buildTypes {
  debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
  release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro'; if(signingPropsFile.exists()){signingConfig signingConfigs.create('githubRelease'){storeFile rootProject.file(signingProps.getProperty('storeFile'));storePassword signingProps.getProperty('storePassword');keyAlias signingProps.getProperty('keyAlias');keyPassword signingProps.getProperty('keyPassword')}} }
 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2' }
